<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostVault ✦ Your Private Cloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div id="login-view" class="view"> 
        <div class="login-card">
            <div class="brand">
                <div class="brand-icon">👻</div>
                <h1>GhostVault</h1>
                <p class="tagline">Your files. Your rules. Zero traces.</p>
            </div>
            <form id="login-form">
                <div class="field">
                    <label>username</label>
                    <input type="text" id="username" placeholder="who goes there?" autocomplete="username" required>
                </div>
                <div class="field">
                    <label>password</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-primary">
                    <span>Enter Vault</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>
            <div id="login-error" class="error"></div>
        </div>
    </div>

    <div id="app-view" class="view hidden">
        <header class="topbar">
            <div class="topbar-brand">
                <span class="brand-icon-sm">👻</span>
                <span class="brand-name">GhostVault</span>
            </div>
            <button id="logout-btn" class="btn-ghost">Logout</button>
        </header>

        <main>
            <section class="hero">
                <h2>hey there <span class="wave">👋</span></h2>
                <p>Drop your files, keep them safe. Nothing here lingers after you leave.</p>
            </section>

            <section class="stats" id="stats-section">
                <div class="stat-card">
                    <div class="stat-label">files</div>
                    <div class="stat-value" id="stat-count">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">storage used</div>
                    <div class="stat-value" id="stat-size">0 B</div>
                </div>
            </section>

            <section class="upload-zone" id="upload-zone">
                <input type="file" id="file-input" hidden>
                <div class="upload-content">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">
                        <strong>drop it like it's hot</strong>
                        <span>or click to browse — max 4 MB</span>
                    </div>
                </div>
                <div id="upload-status" class="upload-status"></div>
                <div class="upload-progress hidden" id="upload-progress">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </section>

            <section class="files-section">
                <div class="section-header">
                    <h3>your stash</h3>
                    <div class="search-box">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <input type="text" id="search-input" placeholder="search files...">
                    </div>
                </div>
                <div id="files-list"></div>
            </section>
        </main>
    </div>

    <div id="preview-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <span id="preview-title">preview</span>
                <button id="preview-close" class="btn-ghost btn-icon">✕</button>
            </div>
            <div id="preview-body"> </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/app.js"></script>
</body>
</html>
